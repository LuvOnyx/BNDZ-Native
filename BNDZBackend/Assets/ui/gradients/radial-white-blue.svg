<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect width="20" height="20" fill="url(#a)" paint-order="stroke" rx="0"/>
  <rect width="20" height="20" fill="url(#b)" rx="0" style="mix-blend-mode:overlay"/>
  <defs>
